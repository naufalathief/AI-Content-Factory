[project]
name = "fer-transfer-learning"
version = "0.1.0"
description = "Facial Expression Recognition Transfer Learning Framework"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "types-pyyaml>=6.0.0",
]


[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "pre-commit>=4.0.0",
]


# ============================================================
# Ruff Configuration
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 88


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


# ============================================================
# Mypy Configuration
# ============================================================

[tool.mypy]
python_version = "3.12"
strict = true

warn_return_any = true
warn_unused_configs = true

disallow_untyped_defs = true
disallow_incomplete_defs = true

check_untyped_defs = true

no_implicit_optional = true

show_error_codes = true


[[tool.mypy.overrides]]
module = [
    "yaml",
]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
]
ignore_missing_imports = true


# ============================================================
# Pytest Configuration
# ============================================================

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = [
    "-ra",
]


# ============================================================
# Coverage Configuration
# ============================================================

[tool.coverage.run]
source = [
    "src",
]

branch = true


[tool.coverage.report]
show_missing = true
skip_empty = true
