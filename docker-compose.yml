services:
  postgres:
    image: postgres:17
    container_name: ai-content-factory-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_content_factory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: