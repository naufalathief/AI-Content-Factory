services:
  postgres:
    image: postgres:17
    container_name: ai-content-factory-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: acf_user
      POSTGRES_PASSWORD: acf_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: