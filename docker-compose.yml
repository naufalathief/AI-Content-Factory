services:

  postgres:
    image: postgres:17
    container_name: ai-content-factory-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-content_factory}
      POSTGRES_USER: ${POSTGRES_USER:-acf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acf_pass}

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-acf_user}"]
      interval: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql/data

  renderer:
    build:
      context: ./renderer

    container_name: ai-content-factory-renderer

    working_dir: /workspace

    stdin_open: true
    tty: true

    command: tail -f /dev/null

    volumes:
      - ./renderer:/workspace
      - ./storage/videos:/storage/videos

    ports:
      - "3000:3000"

volumes:
  postgres_data: