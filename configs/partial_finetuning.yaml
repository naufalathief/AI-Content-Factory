experiment:
  name: mobilenetv2_partial_finetuning


dataset:
  name: FER2013
  image_size: 224
  num_classes: 7


model:
  backbone: mobilenet_v2
  strategy: partial_finetuning
  pretrained: true


training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  optimizer: adam


evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
