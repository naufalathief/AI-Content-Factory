services:

  postgres:
    image: postgres:17
    container_name: ai-content-factory-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: acf_user
      POSTGRES_PASSWORD: acf_pass

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  renderer:
    build:
      context: ./renderer

    container_name: ai-content-factory-renderer

    working_dir: /workspace

    stdin_open: true
    tty: true

    command: tail -f /dev/null

    volumes:
      - ./renderer:/workspace
      - ./storage/videos:/storage/videos

    ports:
      - "3000:3000"

volumes:
  postgres_data: